name: "Laufapp"
version: "0.1.8"
slug: "laufapp"
description: "Privater datenbasierter Laufcoach als PWA mit Apple-Health-Import und optionalem OpenAI-Coach."
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_stream: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Laufapp
panel_admin: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optionaler direkter Webzugriff (standardmäßig deaktiviert; Ingress verwenden)"
options:
  openai_api_key: ""
schema:
  openai_api_key: password
map:
  - share:rw
backup: hot
stage: experimental
watchdog: "http://[HOST]:[PORT:8099]/api/health"
