name: "Laufapp"
version: "0.2.27"
slug: "laufapp"
description: "Privater datenbasierter Laufcoach als PWA mit Apple-Health-Import, gehärtetem Health Auto Export und optionalem OpenAI-Coach."
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_stream: true
ingress_port: 8099
panel_icon: mdi:run-fast
panel_title: Laufapp
panel_admin: true
ports:
  8099/tcp: null
  8100/tcp: null
ports_description:
  8099/tcp: "Nicht veröffentlichen; Oberfläche ausschließlich über Home Assistant Ingress"
  8100/tcp: "Interner Health-Auto-Export-Gateway; für den Home-Assistant-Relay nicht am Host/Router veröffentlichen"
options:
  openai_api_key: ""
  health_auto_export_token: ""
schema:
  openai_api_key: password
  health_auto_export_token: password
backup: hot
stage: experimental
watchdog: "http://[HOST]:[PORT:8099]/api/health"
