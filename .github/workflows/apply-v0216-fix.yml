name: Repair and apply v0.2.16 patch
on:
  push:
    branches: [v0.2.16-activity-linking]
permissions:
  contents: write
jobs:
  repair-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.16-activity-linking
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Extract corrected staging script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-v0216.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          assert marker in source
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if "'laufapp/app/static/sw.js'" in line:
                  line = line.replace('\\"', '"')
              lines.append(line)
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              'rm .github/workflows/apply-v0216.yml',
              'rm .github/workflows/apply-v0216.yml .github/workflows/apply-v0216-fix.yml',
          )
          Path('/tmp/apply-v0216.sh').write_text(script, encoding='utf-8')
          PY
          bash -n /tmp/apply-v0216.sh
      - name: Apply tested v0.2.16 patch
        shell: bash
        run: bash /tmp/apply-v0216.sh