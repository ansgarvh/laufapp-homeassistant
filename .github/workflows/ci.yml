name: Laufapp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q laufapp/app tests
      - name: JavaScript syntax check
        run: |
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
          node --check laufapp/app/static/assets/v020_science.js
          node --check laufapp/app/static/assets/v023_aggressiveness.js
          node --check laufapp/app/static/assets/v025.js
      - name: Full regression suite
        run: pytest -q
      - name: 16-week marathon simulation
        run: python tests/science_plan_simulator.py
      - name: Nine randomized runner simulations
        run: python tests/randomized_runner_simulator.py
      - name: Docker build
        run: docker build --pull --build-arg BUILD_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('laufapp/config.yaml'))['version'])") --build-arg BUILD_ARCH=amd64 -t laufapp-ci:${{ github.sha }} laufapp
      - name: Docker runtime smoke test
        run: |
          set -euo pipefail
          docker run -d --name laufapp-smoke -e LAUFAPP_TRUSTED_INGRESS_ONLY=0 -p 18099:8099 laufapp-ci:${{ github.sha }}
          trap 'docker logs laufapp-smoke || true; docker rm -f laufapp-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/laufapp-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, yaml
          data=json.load(open('/tmp/laufapp-health.json'))
          expected=yaml.safe_load(open('laufapp/config.yaml'))['version']
          assert data == {'ok': True, 'version': expected}, data
          PY
          curl -fsS -D /tmp/root.headers -o /tmp/root.html http://127.0.0.1:18099/
          grep -qi '^cache-control: no-store, max-age=0' /tmp/root.headers
          grep -q 'assets/v020.js?v=0.2.5' /tmp/root.html
          grep -q 'assets/v020_science.js?v=0.2.5' /tmp/root.html
          grep -q 'assets/v023_aggressiveness.js?v=0.2.5' /tmp/root.html
          grep -q 'assets/v025.js?v=0.2.5' /tmp/root.html
          curl -fsS -o /tmp/healthkit.json -H 'Content-Type: application/json' -d '{"schema_version":1,"source":"laufapp_ios","device_id":"ci","workouts":[{"id":"ci-healthkit-run","activity_type":"running","start_at":"2026-08-30T08:00:00+02:00","end_at":"2026-08-30T08:30:00+02:00","distance_km":6.0,"duration_s":1800,"samples":[{"id":"ci-hr","type":"heart_rate","at":"2026-08-30T08:01:00+02:00","value":145,"unit":"count/min"}],"route":[]}],"metrics":[]}' http://127.0.0.1:18099/api/v3/healthkit/sync
          python - <<'PY'
          import json
          data=json.load(open('/tmp/healthkit.json'))
          assert data['ok'] is True and data['workouts_added']==1 and data['samples_added']==1, data
          PY
          curl -fsS -o /tmp/healthkit-status.json http://127.0.0.1:18099/api/v3/healthkit/status
          python - <<'PY'
          import json
          data=json.load(open('/tmp/healthkit-status.json'))
          assert data['connected_source']=='native_healthkit' and data['live_runs']>=1, data
          PY

  ios-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Compile iOS companion for simulator
        run: xcodebuild -project ios/Laufapp.xcodeproj -scheme Laufapp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
