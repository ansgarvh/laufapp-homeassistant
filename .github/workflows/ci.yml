name: Laufapp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q laufapp/app tests
      - name: JavaScript syntax check
        run: |
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
          node --check laufapp/app/static/assets/v020_science.js
          node --check laufapp/app/static/assets/v023_aggressiveness.js
          node --check laufapp/app/static/assets/v025.js
      - name: Full regression suite
        run: pytest -q
      - name: 16-week marathon simulation
        run: python tests/science_plan_simulator.py
      - name: Nine randomized runner simulations
        run: python tests/randomized_runner_simulator.py
      - name: Docker build
        run: docker build --pull --build-arg BUILD_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('laufapp/config.yaml'))['version'])") --build-arg BUILD_ARCH=amd64 -t laufapp-ci:${{ github.sha }} laufapp
      - name: Docker runtime and Health Auto Export smoke test
        run: |
          set -euo pipefail
          docker run -d --name laufapp-smoke -e LAUFAPP_TRUSTED_INGRESS_ONLY=0 -e LAUFAPP_HEALTH_AUTO_EXPORT_TOKEN=ci-secret -p 18099:8099 -p 18100:8100 laufapp-ci:${{ github.sha }}
          trap 'docker logs laufapp-smoke || true; docker rm -f laufapp-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/laufapp-health.json && curl -fsS http://127.0.0.1:18100/health > /tmp/gateway-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, yaml
          expected=yaml.safe_load(open('laufapp/config.yaml'))['version']
          assert json.load(open('/tmp/laufapp-health.json')) == {'ok': True, 'version': expected}
          assert json.load(open('/tmp/gateway-health.json')) == {'ok': True, 'version': expected}
          PY
          curl -fsS -D /tmp/root.headers -o /tmp/root.html http://127.0.0.1:18099/
          grep -qi '^cache-control: no-store, max-age=0' /tmp/root.headers
          grep -q 'assets/v025.js?v=0.2.5' /tmp/root.html
          curl -fsS -o /tmp/races.json http://127.0.0.1:18099/api/v2/races
          curl -fsS -o /tmp/settings.json http://127.0.0.1:18099/api/settings
          curl -fsS -o /tmp/marks.json http://127.0.0.1:18099/api/v2/performance-marks
          python - <<'PY'
          import json
          assert isinstance(json.load(open('/tmp/races.json')), list)
          assert isinstance(json.load(open('/tmp/marks.json')).get('stored'), list)
          PY
          cat > /tmp/hae.json <<'JSON'
          {"data":{"workouts":[{"id":"ci-hae-run","name":"Running","start":"2026-08-30 08:00:00 +0200","end":"2026-08-30 08:30:00 +0200","duration":1800,"distance":{"qty":5.0,"units":"km"},"avgHeartRate":{"qty":150,"units":"bpm"},"heartRateData":[{"date":"2026-08-30 08:00:01 +0200","Avg":145,"units":"bpm"}],"runningPower":[{"date":"2026-08-30 08:00:01 +0200","qty":300,"units":"W"}],"route":[{"latitude":50.775,"longitude":6.083,"altitude":180,"timestamp":"2026-08-30 08:00:00 +0200"}]}],"metrics":[{"name":"resting_heart_rate","units":"bpm","data":[{"qty":49,"date":"2026-08-30 06:00:00 +0200"}]}]}}
          JSON
          test "$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export)" = "401"
          curl -fsS -H 'Authorization: Bearer ci-secret' -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export > /tmp/hae-result.json
          curl -fsS -H 'X-Laufapp-Token: ci-secret' -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export > /tmp/hae-result-2.json
          python - <<'PY'
          import json
          first=json.load(open('/tmp/hae-result.json')); second=json.load(open('/tmp/hae-result-2.json'))
          assert first['ok'] and first['runs_added']==1 and first['samples_added']==2 and first['gps_points_added']==1 and first['health_metrics_added']==1, first
          assert second['ok'] and second['runs_existing']==1 and second['samples_added']==0 and second['gps_points_added']==0 and second['health_metrics_added']==0, second
          PY
