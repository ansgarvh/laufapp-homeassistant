name: Laufapp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q laufapp/app tests
      - name: JavaScript syntax check
        run: |
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
      - name: Full regression suite
        run: pytest -q
      - name: Docker build
        run: docker build --pull --build-arg BUILD_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('laufapp/config.yaml'))['version'])") --build-arg BUILD_ARCH=amd64 -t laufapp-ci:${{ github.sha }} laufapp
