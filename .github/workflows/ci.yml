name: Laufapp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Dependency vulnerability audit
        run: pip-audit -r laufapp/requirements.txt
      - name: Python compile check
        run: python -m compileall -q laufapp/app custom_components/laufapp_hae_relay tests scripts
      - name: JavaScript syntax check
        run: |
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
          node --check laufapp/app/static/assets/v020_science.js
          node --check laufapp/app/static/assets/v023_aggressiveness.js
          node --check laufapp/app/static/assets/v025.js
      - name: Full regression suite
        run: pytest -q
      - name: 16-week marathon simulation
        run: python tests/science_plan_simulator.py
      - name: Nine randomized runner simulations
        run: python tests/randomized_runner_simulator.py
      - name: Docker build
        run: docker build --pull --build-arg BUILD_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('laufapp/config.yaml'))['version'])") --build-arg BUILD_ARCH=amd64 -t laufapp-ci:${{ github.sha }} laufapp
      - name: Docker runtime, HAE, Nabu relay and Home Assistant ingress security E2E
        run: |
          set -euo pipefail
          TOKEN='9f4a6c2d8e1b7a305c9d4e6f1a2b8c70d5e3f9a1c6b4d8e2f7a0c3b5d9e1f6a4'
          cleanup() {
            docker logs laufapp-smoke >/dev/null 2>&1 || true
            docker logs laufapp-security >/dev/null 2>&1 || true
            docker logs laufapp-ingress >/dev/null 2>&1 || true
            docker rm -f laufapp-smoke laufapp-security laufapp-ingress >/dev/null 2>&1 || true
            docker network rm ha-relay-test >/dev/null 2>&1 || true
            docker network rm ha-ingress-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create ha-relay-test
          docker run -d --name laufapp-smoke \
            --network ha-relay-test \
            -e LAUFAPP_TRUSTED_INGRESS_ONLY=0 \
            -e LAUFAPP_HEALTH_AUTO_EXPORT_TOKEN="$TOKEN" \
            -p 18099:8099 -p 18100:8100 \
            laufapp-ci:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/laufapp-health.json && curl -fsS -D /tmp/gateway.headers http://127.0.0.1:18100/health > /tmp/gateway-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, yaml
          expected=yaml.safe_load(open('laufapp/config.yaml'))['version']
          assert json.load(open('/tmp/laufapp-health.json')) == {'ok': True, 'version': expected}
          assert json.load(open('/tmp/gateway-health.json')) == {'ok': True}
          PY
          grep -qi '^cache-control: no-store' /tmp/gateway.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/gateway.headers
          if grep -qi '^server:' /tmp/gateway.headers; then echo 'Gateway leaks Server header' >&2; exit 1; fi

          curl -fsS -D /tmp/root.headers -o /tmp/root.html http://127.0.0.1:18099/
          grep -qi '^cache-control: no-store, max-age=0' /tmp/root.headers
          grep -q 'assets/v025.js?v=0.2.5' /tmp/root.html
          curl -fsS -o /tmp/races.json http://127.0.0.1:18099/api/v2/races
          curl -fsS -o /tmp/settings.json http://127.0.0.1:18099/api/settings
          curl -fsS -o /tmp/marks.json http://127.0.0.1:18099/api/v2/performance-marks
          python - <<'PY'
          import json
          assert isinstance(json.load(open('/tmp/races.json')), list)
          assert isinstance(json.load(open('/tmp/marks.json')).get('stored'), list)
          PY

          cat > /tmp/hae.json <<'JSON'
          {"data":{"workouts":[{"id":"ci-hae-run","name":"Running","start":"2026-08-30 08:00:00 +0200","end":"2026-08-30 08:30:00 +0200","duration":1800,"distance":{"qty":5.0,"units":"km"},"avgHeartRate":{"qty":150,"units":"bpm"},"heartRateData":[{"date":"2026-08-30 08:00:01 +0200","Avg":145,"units":"bpm"}],"runningPower":[{"date":"2026-08-30 08:00:01 +0200","qty":300,"units":"W"}],"route":[{"latitude":50.775,"longitude":6.083,"altitude":180,"timestamp":"2026-08-30 08:00:00 +0200"}]}],"metrics":[{"name":"Resting Heart Rate","units":"bpm","data":[{"qty":49,"date":"2026-08-30 06:00:00 +0200"}]}]}}
          JSON
          test "$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export)" = "401"
          test "$(curl -sS -o /tmp/wrongtype.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: text/plain' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export)" = "415"
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export > /tmp/hae-result.json
          curl -fsS -H "X-Laufapp-Token: $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/hae.json http://127.0.0.1:18100/health-auto-export > /tmp/hae-result-2.json
          python - <<'PY'
          import json
          first=json.load(open('/tmp/hae-result.json')); second=json.load(open('/tmp/hae-result-2.json'))
          assert first['ok'] and first['runs_added']==1 and first['samples_added']==2 and first['gps_points_added']==1 and first['health_metrics_added']==1, first
          assert second['ok'] and second['runs_existing']==1 and second['samples_added']==0 and second['gps_points_added']==0 and second['health_metrics_added']==0, second
          assert 'predictions' not in first and 'version' not in first, first
          PY

          cat > /tmp/hae-relay.json <<'JSON'
          {"data":{"workouts":[{"id":"ci-nabu-relay-run","name":"Running","start":"2026-08-30 10:00:00 +0200","end":"2026-08-30 10:30:00 +0200","duration":1800,"distance":{"qty":5.0,"units":"km"},"heartRateData":[{"date":"2026-08-30 10:00:01 +0200","Avg":146,"units":"bpm"}],"runningPower":[{"date":"2026-08-30 10:00:01 +0200","qty":301,"units":"W"}],"route":[{"latitude":50.775,"longitude":6.083,"altitude":180,"timestamp":"2026-08-30 10:00:00 +0200"}]}],"metrics":[]}}
          JSON
          test "$(curl -sS -o /tmp/relay-bearer.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/hae-relay.json http://127.0.0.1:18100/home-assistant-relay)" = "401"
          docker run --rm --network ha-relay-test \
            -e TOKEN="$TOKEN" \
            -v /tmp/hae-relay.json:/tmp/hae-relay.json:ro \
            --entrypoint python laufapp-ci:${{ github.sha }} -c \
            "import json,os,urllib.request; data=open('/tmp/hae-relay.json','rb').read(); url='http://laufapp-smoke:8100/home-assistant-relay'; headers={'Content-Type':'application/json','X-Laufapp-Token':os.environ['TOKEN']}; first=json.loads(urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method='POST'),timeout=5).read()); second=json.loads(urllib.request.urlopen(urllib.request.Request(url,data=data,headers=headers,method='POST'),timeout=5).read()); assert first['ok'] and first['runs_added']==1 and first['samples_added']==2 and first['gps_points_added']==1, first; assert second['ok'] and second['runs_existing']==1 and second['samples_added']==0 and second['gps_points_added']==0, second; assert 'predictions' not in first and 'version' not in first"
          docker logs laufapp-smoke 2>&1 | grep -q 'LAUFAPP_HAE_RELAY_OK transport=nabu_casa'

          docker rm -f laufapp-smoke >/dev/null
          docker network rm ha-relay-test >/dev/null

          docker run -d --name laufapp-security \
            -e LAUFAPP_TRUSTED_INGRESS_ONLY=1 \
            -e LAUFAPP_HEALTH_AUTO_EXPORT_TOKEN="$TOKEN" \
            -p 28099:8099 \
            laufapp-ci:${{ github.sha }}
          for i in $(seq 1 60); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' laufapp-security 2>/dev/null || true)
            [[ "$STATUS" == "healthy" ]] && break
            [[ "$STATUS" == "unhealthy" ]] && exit 1
            sleep 1
          done
          test "$(curl -sS -o /tmp/blocked.json -w '%{http_code}' \
            -H 'X-Forwarded-For: 127.0.0.1' \
            -H 'X-Hass-Source: core.ingress' \
            -H 'X-Ingress-Path: /api/hassio_ingress/forged' \
            -H 'X-Remote-User-Id: forged-user' \
            http://127.0.0.1:28099/)" = "403"
          docker rm -f laufapp-security >/dev/null

          docker network create --subnet 172.30.32.0/23 ha-ingress-test
          docker run -d --name laufapp-ingress \
            --network ha-ingress-test --ip 172.30.33.50 \
            -e LAUFAPP_TRUSTED_INGRESS_ONLY=1 \
            laufapp-ci:${{ github.sha }}
          for i in $(seq 1 60); do
            if docker exec laufapp-ingress python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health',timeout=1).read()"; then break; fi
            sleep 1
          done

          docker run --rm --network ha-ingress-test --ip 172.30.32.2 --entrypoint python laufapp-ci:${{ github.sha }} -c \
            "import urllib.request; r=urllib.request.urlopen('http://172.30.33.50:8099/',timeout=3); assert r.status==200 and b'Laufapp' in r.read()"

          docker run --rm --network ha-ingress-test --ip 172.30.33.5 --entrypoint python laufapp-ci:${{ github.sha }} -c \
            "import urllib.request; q=urllib.request.Request('http://172.30.33.50:8099/',headers={'X-Ingress-Path':'/api/hassio_ingress/test-session','X-Remote-User-Id':'ci-user'}); r=urllib.request.urlopen(q,timeout=3); assert r.status==200 and b'Laufapp' in r.read()"

          docker run --rm --network ha-ingress-test --ip 172.30.33.6 --entrypoint python laufapp-ci:${{ github.sha }} -c \
            "import http.client; c=http.client.HTTPConnection('172.30.33.50',8099,timeout=3); c.request('GET','/',headers={'X-Ingress-Path':'/api/hassio_ingress/test-session'}); r=c.getresponse(); assert r.status==403"

      - name: Gateway remains closed without a strong token
        run: |
          set -euo pipefail
          docker run -d --name laufapp-no-token \
            -e LAUFAPP_TRUSTED_INGRESS_ONLY=0 \
            -p 38099:8099 -p 38100:8100 \
            laufapp-ci:${{ github.sha }}
          trap 'docker logs laufapp-no-token || true; docker rm -f laufapp-no-token >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:38099/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:38099/api/health >/dev/null
          if curl --connect-timeout 1 -fsS http://127.0.0.1:38100/health >/dev/null 2>&1; then
            echo 'Health Auto Export gateway unexpectedly reachable without a strong token' >&2
            exit 1
          fi