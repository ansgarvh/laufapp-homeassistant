name: Laufapp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same pull request makes the older full CI result obsolete.
# Keep main-push and manual runs independent so final/release validation is never skipped.
concurrency:
  group: laufapp-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Python compile check
        run: python -m compileall -q laufapp/app tests
      - name: JavaScript syntax check
        run: |
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
          node --check laufapp/app/static/assets/v020_science.js
      - name: Full regression suite
        run: pytest -q
      - name: 16-week marathon simulation
        run: python tests/science_plan_simulator.py
      - name: Nine randomized runner simulations
        run: python tests/randomized_runner_simulator.py
      - name: Docker build
        run: docker build --pull --build-arg BUILD_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('laufapp/config.yaml'))['version'])") --build-arg BUILD_ARCH=amd64 -t laufapp-ci:${{ github.sha }} laufapp
      - name: Docker runtime smoke test
        run: |
          set -euo pipefail
          docker run -d --name laufapp-smoke -e LAUFAPP_TRUSTED_INGRESS_ONLY=0 -p 18099:8099 laufapp-ci:${{ github.sha }}
          trap 'docker logs laufapp-smoke || true; docker rm -f laufapp-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health > /tmp/laufapp-health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json, yaml
          data=json.load(open('/tmp/laufapp-health.json'))
          expected=yaml.safe_load(open('laufapp/config.yaml'))['version']
          assert data == {'ok': True, 'version': expected}, data
          PY
          curl -fsS -D /tmp/root.headers -o /tmp/root.html http://127.0.0.1:18099/
          grep -qi '^cache-control: no-store, max-age=0' /tmp/root.headers
          grep -q 'assets/v020.js?v=0.2.2' /tmp/root.html
          grep -q 'assets/v020_science.js?v=0.2.2' /tmp/root.html
          curl -fsS -D /tmp/asset.headers -o /tmp/v020.js 'http://127.0.0.1:18099/assets/v020.js?v=0.2.2'
          grep -qi '^cache-control: no-store, max-age=0' /tmp/asset.headers
          grep -q 'A-Rennen' /tmp/v020.js
          grep -q 'B-Rennen' /tmp/v020.js
          grep -q 'api/v2/races' /tmp/v020.js
          curl -fsS -o /tmp/science.js 'http://127.0.0.1:18099/assets/v020_science.js?v=0.2.2'
          grep -q 'Planungsaggressivität' /tmp/science.js
          grep -q 'Konservativ' /tmp/science.js
          grep -q 'Moderat' /tmp/science.js
          grep -q 'Aggressiv' /tmp/science.js
          curl -fsS -o /tmp/races.json http://127.0.0.1:18099/api/v2/races
          curl -fsS -o /tmp/settings.json http://127.0.0.1:18099/api/settings
          python - <<'PY'
          import json
          races=json.load(open('/tmp/races.json'))
          settings=json.load(open('/tmp/settings.json'))
          assert isinstance(races,list), races
          assert settings.get('training_volume_profile') in {'gradual','steady','progressive'}, settings
          PY
