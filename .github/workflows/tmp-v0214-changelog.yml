name: Temporary v0.2.14 changelog updater

on:
  push:
    branches: [v0.2.14-week-ui]

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.2.14-week-ui
      - name: Prepend changelog and remove helper
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## v0.2.14' CHANGELOG.md; then
            tmp="$(mktemp)"
            printf '%s\n\n' '# Laufapp Changelog' > "$tmp"
            printf '%s\n\n' '## v0.2.14 – 2026-08-31' >> "$tmp"
            printf '%s\n' '- Wochenkarten zeigen für `completed`-Einheiten links einen grünen Haken; Status-Text und bestehende Karten-/Drag-Ausrichtung bleiben erhalten.' >> "$tmp"
            printf '%s\n' '- Wochen-Datumsbereich aus der oberen Navigationsleiste direkt über die sieben Tagesfelder verschoben; Wochenwechsel, Swipe und „Aktuelle Woche“ bleiben unverändert.' >> "$tmp"
            printf '%s\n' '- App-/Docker-/Gateway-/PWA-Version auf 0.2.14 synchronisiert; Service-Worker-Cache aktualisiert und additive v0.2.14-UI-Schicht eingebunden; die bestehende `app.js` bleibt unverändert.' >> "$tmp"
            printf '%s\n' '- Keine Datenbankschemamigration, keine Änderung der Trainingsengine, Health-Auto-Export-Logik oder Security-Grenzen.' >> "$tmp"
            printf '%s\n' '- Neue UI-Regressionstests prüfen Status-Hook, grünen Haken und Position des Wochenzeitraums.' >> "$tmp"
            printf '%s\n\n' '- Statisch/isoliert und in Linux/Docker zu verifizieren; reale Home-Assistant-OS-/Ingress-Darstellung muss nach Installation lokal bestätigt werden.' >> "$tmp"
            tail -n +3 CHANGELOG.md >> "$tmp"
            mv "$tmp" CHANGELOG.md
          fi
          git rm .github/workflows/tmp-v0214-changelog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: add v0.2.14 changelog'
          git push origin HEAD:v0.2.14-week-ui
