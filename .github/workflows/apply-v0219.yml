name: Apply verified v0.2.19 patch
on:
  push:
    branches:
      - v0.2.19-manual-completion-undo
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.19-manual-completion-undo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        run: python .github/scripts/apply_v0219.py
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r laufapp/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile and syntax checks
        run: |
          python -m compileall -q laufapp/app custom_components/laufapp_hae_relay
          node --check laufapp/app/static/app.js
          bash -n laufapp/run.sh
      - name: Full regression suite
        run: pytest -q
      - name: Simulations
        run: |
          python tests/science_plan_simulator.py
          python tests/randomized_runner_simulator.py
      - name: Commit verified patch and remove helpers
        run: |
          rm .github/workflows/apply-v0219.yml .github/scripts/apply_v0219.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.2.19: reversible manual workout completion"
          git push origin HEAD:v0.2.19-manual-completion-undo
