name: Finalize v0.2.19 security baseline
on:
  push:
    branches:
      - v0.2.19-manual-completion-undo
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.19-manual-completion-undo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore unchanged legacy main.py
        run: |
          git checkout 0960b2cdbf67989b28c19e27a69813925b5f0751 -- laufapp/app/main.py
          git diff --quiet 0960b2cdbf67989b28c19e27a69813925b5f0751 -- laufapp/app/main.py
      - name: Install dependencies
        run: |
          python -m pip install -r laufapp/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile and syntax checks
        run: |
          python -m compileall -q laufapp/app custom_components/laufapp_hae_relay
          node --check laufapp/app/static/app.js
          bash -n laufapp/run.sh
      - name: Full regression suite
        run: pytest -q
      - name: Simulations
        run: |
          python tests/science_plan_simulator.py
          python tests/randomized_runner_simulator.py
      - name: Security scan
        run: |
          bandit -r laufapp/app custom_components/laufapp_hae_relay -ll -ii -f json -o /tmp/bandit.json || true
          python scripts/bandit_gate.py /tmp/bandit.json
      - name: Commit verified final source
        run: |
          rm .github/workflows/finalize-v0219-security-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v0.2.19: keep legacy security baseline stable"
          git push origin HEAD:v0.2.19-manual-completion-undo
