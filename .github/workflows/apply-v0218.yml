name: Apply verified v0.2.18 patch

on:
  push:
    branches:
      - v0.2.18-race-calendar
    paths:
      - .github/workflows/apply-v0218.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify and apply locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/v0218.part1 .github/tmp/v0218.part2 .github/tmp/v0218.part3 .github/tmp/v0218.part4 > /tmp/v0218.patch.gz.b64
          test "$(wc -c < /tmp/v0218.patch.gz.b64)" = "28676"
          echo '7728b832df5a7baee8c79336682af1477c334b63f47d784beddd9806a4c97da0  /tmp/v0218.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v0218.patch.gz.b64 | gzip -d > /tmp/v0218.patch
          echo '310326dae0ec6f7bf21096ec3a022fe365baa2ff66b22f2a808e544fe89b224b  /tmp/v0218.patch' | sha256sum -c -
          git apply --check /tmp/v0218.patch
          git apply /tmp/v0218.patch
          rm -f .github/tmp/v0218.part1 .github/tmp/v0218.part2 .github/tmp/v0218.part3 .github/tmp/v0218.part4 .github/tmp/v0218.patch.gz.b64
          rm -f .github/workflows/apply-v0218.yml
          git diff --check
          python -m compileall -q laufapp/app custom_components/laufapp_hae_relay tests scripts
          node --check laufapp/app/static/app.js
          node --check laufapp/app/static/assets/v020.js
          node --check laufapp/app/static/assets/v020_science.js
          node --check laufapp/app/static/assets/v023_aggressiveness.js
          node --check laufapp/app/static/assets/v025.js
          node --check laufapp/app/static/assets/v0213.js
          bash -n laufapp/run.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.2.18: race calendar and immutable history'
          git push origin HEAD:v0.2.18-race-calendar
