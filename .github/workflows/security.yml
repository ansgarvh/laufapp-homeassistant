name: Laufapp Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install security tooling and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r laufapp/requirements.txt -r requirements-dev.txt
      - name: Dependency vulnerabilities
        run: pip-audit -r laufapp/requirements.txt
      - name: Python security scan
        run: |
          bandit -r laufapp/app -ll -ii -f json -o /tmp/bandit.json || true
          python scripts/bandit_gate.py /tmp/bandit.json
